project:
  type: website
  render:
    - "*.qmd"
  output-dir: _site
  post-render:
    - scripts/build/optimize.ts # minify files rendered by quarto to reduce file size

website:
  favicon: images/atlas-icon.svg
  site-url: https://adaptationatlas.github.io/atlas_notebooks/
  search: false
  navbar:
    logo: images/atlas-logo.svg
    logo-href: https://adaptationatlas.cgiar.org
    logo-alt: "The Africa Agriculture Adaptation Atlas"
    right:
      - icon: github
        href: https://github.com/AdaptationAtlas/atlas_notebooks
        aria-label: "GitHub"
  page-footer:
    left: "© 2026 AAA & CGIAR"
    right:
      - icon: bi-info-circle
        text: "Documentation"
        href: docs/doc_index.qmd
        aria-label: "More Information"
      - text: "Report an Issue"
        href: https://github.com/AdaptationAtlas/atlas_notebooks/issues/new
      - text: "Policy"
        href: docs/policy.qmd

format:
  html:
    title-block-style: none
    include-in-header:
      - text: |
          <script src="/components/backToTop.js"></script>
      - text: |
          <script src="/components/atlasToc.js"></script>
      - text: |
          <script data-goatcounter="https://africaadaptationatlas.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
    theme:
      - cosmo
    css: styles/main.css
    grid:
      body-width: 1180px
    toc: false # complex/not useful with how we handle translations
    anchor-sections: false # remove section link hovers

# Only directories pages fetch at RUNTIME belong here — keep it scoped
# (data/docs/*.json is build-time only, and untracked dev data under data/
# must not be swept into _site). When adding a notebook, add its
# data/<notebook>/ dir.
resources:
  - data/cis/
  - data/economicReturns/
  - data/genderExposure/
  - data/shared/
  - helpers/
  - components/
  - images/
  - admin/ # Sveltia CMS (git-based content editor) at /admin/

execute:
  echo: false # don't show code unless explicitly requested

lang: en # page language at build; the client-side toggle updates <html lang> at runtime

filters:
  - quarto # run built-ins (incl. shortcode expansion) first so cmsContent.lua sees the headers {{< prose >}} emits
  - "scripts/build/cmsContent.lua" # embed CMS-managed content (notebook prose, FAQ/glossary) at render

shortcodes:
  - "scripts/build/proseShortcode.lua" # {{< prose <id> >}} sugar for the cmsContent.lua prose markers
