project:
  type: website
  render:
    - "*.qmd"
  output-dir: _site
  post-render:
    - scripts/build/optimize.ts # minify files rendered by quarto to reduce file size

website:
  favicon: images/atlas-icon.svg
  site-url: https://adaptationatlas.github.io/atlas_notebooks/
  search: true
  navbar:
    pinned: true # drop the headroom auto-hide; the navbar stays put on scroll
    background: white
    logo: images/atlas-logo.svg
    logo-href: https://adaptationatlas.cgiar.org
    logo-alt: "The Africa Agriculture Adaptation Atlas"
    right:
      - text: "FAQ"
        href: docs/faq.qmd
      - text: "[Glossary]{.nb-i18n lang=en}[Glossaire]{.nb-i18n lang=fr}"
        href: docs/glossary.qmd
      - icon: github
        href: https://github.com/AdaptationAtlas/atlas_notebooks
        aria-label: "GitHub"
  page-footer:
    left: "© 2026 AAA & CGIAR"
    center:
      - text: "[Report an Issue]{.nb-i18n lang=en}[Signaler un problème]{.nb-i18n lang=fr}"
        href: https://github.com/AdaptationAtlas/atlas_notebooks/issues/new
      - text: "[Policy]{.nb-i18n lang=en}[Politique]{.nb-i18n lang=fr}"
        href: docs/policy.qmd
    right: |
      [![The CGIAR Climate Action Program](/images/CASP_logo.svg){.atlas-footer-logo .atlas-footer-logo--casp}](https://www.cgiar.org/cgiar-research-portfolio-2025-2030/climate-action)
      [![Alliance of Bioversity International and CIAT](/images/alliance-logo.png){.atlas-footer-logo}](https://alliancebioversityciat.org)

format:
  html:
    title-block-style: none
    include-in-header:
      - text: |
          <script src="/components/backToTop.js"></script>
          <script src="/components/tocMobile.js"></script>
      - text: |
          <script data-goatcounter="https://africaadaptationatlas.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
    theme: cosmo
    css:
      - styles/toc.css
      - styles/hero.css
      - styles/observable-inputs.css
      - styles/admin-selectors.css
      - styles/atlas-table.css
      - styles/ui-components.css
      - styles/citation.css
      - styles/main.css
    grid:
      body-width: 1180px
    toc: true
    toc-depth: 2
    toc-location: right
    toc-title: "[In this notebook]{.nb-i18n lang=en}[Dans ce notebook]{.nb-i18n lang=fr}"
    anchor-sections: false # remove section link hovers

# Include only runtime-fetched directories; add each notebook's data directory.
# Build-time and untracked development data must not enter _site.
resources:
  - data/cis/
  - data/economicReturns/
  - data/genderExposure/
  - data/lossDamage/
  - data/shared/
  - helpers/
  - components/
  - images/
  - admin/ # Sveltia CMS (git-based content editor) at /admin/

execute:
  echo: false # don't show code unless explicitly requested

lang: en # page language at build; the client-side toggle updates <html lang> at runtime

filters:
  - quarto # run built-ins (incl. shortcode expansion) first so cmsContent.lua sees the headers {{< prose >}} emits
  - "scripts/build/cmsContent.lua" # embed CMS-managed content (notebook prose, FAQ/glossary) at render

shortcodes:
  - "scripts/build/proseShortcode.lua" # {{< prose <id> >}} sugar for the cmsContent.lua prose markers
