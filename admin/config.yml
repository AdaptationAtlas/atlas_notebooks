# Sveltia CMS configuration — https://sveltiacms.app/en/docs
# Served at <site>/admin/. Sign in with a GitHub personal access token (repo scope),
# use "Work with Local Repository" for local editing, or set up an OAuth app +
# https://github.com/sveltia/sveltia-cms-auth and add `base_url:` under `backend:`.
#
# The CMS edits notebook narrative and the FAQ/glossary data. Narrative is
# one file per block at
# data/<notebook>/text/<id>.<locale>.md (front matter `title:` + markdown body).
# The block id is the filename — authors never see or edit it; the notebook
# .qmd places blocks by id and scripts/build/cmsContent.lua embeds them at render.
# `create: false` keeps the block set fixed (developers add blocks in the repo,
# where scripts/build/checkTranslations.ts enforces the contract).
#
# Everything else — page title (`meta.title`), widget labels, tooltips,
# templated sentences — lives in data/<notebook>/text/<locale>.json and is
# edited in the repo: those keys are coupled to notebook code and page
# metadata, so changes there go through review.
#
# To add a notebook: copy the collection stanza below and point `folder:` at
# the new data/<notebook>/text directory.

backend:
  name: github
  repo: AdaptationAtlas/atlas_notebooks
  # CMS edits commit here and reach production through the normal
  # develop -> main PR (Sveltia's simple workflow commits directly to the
  # configured branch — there is no built-in review step, so don't point
  # this at main unless direct-to-production publishing is intended).
  branch: develop

media_folder: images/uploads
public_folder: /images/uploads

i18n:
  structure: multiple_files
  locales: [en, fr]
  default_locale: en

collections:
  # FAQ and glossary: structured JSON rendered at build time by
  # scripts/build/cmsContent.lua. Both languages live side by side per entry,
  # so translations can't drift apart. Entry order = page order.
  - name: docs
    label: Site Pages
    icon: help
    files:
      - name: faq
        label: FAQ
        file: data/docs/faq.json
        fields:
          - name: entries
            label: Questions
            label_singular: Question
            widget: list
            summary: "{{fields.question_en}}"
            fields:
              - { name: section_en, label: Section (EN), widget: string }
              - { name: section_fr, label: Section (FR), widget: string }
              - { name: question_en, label: Question (EN), widget: string }
              - { name: question_fr, label: Question (FR), widget: string }
              - { name: answer_en, label: Answer (EN), widget: markdown }
              - { name: answer_fr, label: Answer (FR), widget: markdown }
      - name: glossary
        label: Glossary
        file: data/docs/glossary.json
        fields:
          - name: entries
            label: Terms
            label_singular: Term
            widget: list
            summary: "{{fields.term}}"
            fields:
              - { name: term, label: Term, widget: string }
              - { name: acronym, label: Acronym, widget: string, required: false }
              - { name: section, label: Section, widget: string }
              - { name: definition_en, label: Definition (EN), widget: text }
              - { name: definition_fr, label: Definition (FR), widget: text }
              - { name: tooltip_en, label: Tooltip (EN), widget: text, required: false }
              - { name: tooltip_fr, label: Tooltip (FR), widget: text, required: false }

  - name: roi
    label: Economic Returns
    icon: article
    folder: data/economicReturns/text
    extension: md
    format: yaml-frontmatter
    i18n: true
    create: false
    delete: false
    duplicate: false
    identifier_field: title
    fields:
      - { name: title, label: Heading, widget: string, i18n: true }
      - { name: body, label: Content, widget: markdown, i18n: true }

  - name: gender
    label: Women's Climate Exposure
    icon: article
    folder: data/genderExposure/text
    extension: md
    format: yaml-frontmatter
    i18n: true
    create: false
    delete: false
    duplicate: false
    identifier_field: title
    fields:
      - { name: title, label: Heading, widget: string, i18n: true }
      - { name: body, label: Content, widget: markdown, i18n: true }

  - name: lossDamage
    label: Climate Payouts to Smallholders
    icon: article
    folder: data/lossDamage/text
    extension: md
    format: yaml-frontmatter
    i18n: true
    create: false
    delete: false
    duplicate: false
    identifier_field: title
    fields:
      - { name: title, label: Heading, widget: string, i18n: true }
      - { name: body, label: Content, widget: markdown, i18n: true }
