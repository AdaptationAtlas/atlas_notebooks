# Validate the translation/content contracts on every PR — not only at
# publish time — so broken content is caught before it lands.
on:
  pull_request:
    paths:
      - "data/**"
      - "notebooks/**"
      - "scripts/build/checkTranslations.ts"

name: Check translations

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check translations
        run: deno run --allow-read scripts/build/checkTranslations.ts
