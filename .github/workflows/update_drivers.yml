name: Climate Driver & Forecast Telemetry Pipeline

on:
  schedule:
    # 10th: CPC monthly indices (posted ~5th-8th) + SINTEX M-init run (mid-month) ; 23rd: IRI plume (~19th-21st)
    # Note: GitHub only fires schedules on the default branch (main). Until this workflow is merged there,
    # run `python3 scripts/update_drivers.py` by hand (see .claude/skills/update-climate-drivers).
    - cron: '0 4 10,23 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-fetch of all feeds'
        required: false
        type: boolean
        default: false

concurrency:
  group: update-drivers
  cancel-in-progress: false

jobs:
  update-drivers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.2 pyarrow==16.1.0 requests==2.32.3

      - name: Ingest NOAA & JAMSTEC Climate Telemetry
        run: |
          python scripts/update_drivers.py

      - name: Commit and push updated climate datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add data/KE-enso-explorer/ data/KE-enso-explorer/_sources/*.snapshot.*
          
          if git diff --staged --quiet; then
            echo "No data changes detected. Everything is up to date."
          else
            STAMP=$(date -u +"%Y-%m-%d")
            git commit -m "chore(data): refresh climate drivers and forecast plumes ($STAMP)" -m "Automated run of scripts/update_drivers.py; all 30 freshness/fidelity checks passed."
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
            echo "Pushed updated climate datasets to branch ${{ github.ref_name }}."
          fi
