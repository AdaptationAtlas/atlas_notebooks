name: Climate Driver & Forecast Telemetry Pipeline

on:
  schedule:
    # Runs at 04:00 UTC on the 6th and 21st of every month
    # Note: On GitHub Actions, schedule triggers on the default branch (main).
    - cron: '0 4 6,21 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-fetch of all feeds'
        required: false
        type: boolean
        default: false

concurrency:
  group: update-drivers
  cancel-in-progress: false

jobs:
  update-drivers:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.2 pyarrow==16.1.0 requests==2.32.3

      - name: Ingest NOAA & JAMSTEC Climate Telemetry
        run: |
          python scripts/update_drivers.py

      - name: Commit and push updated climate datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add data/KE-enso-explorer/
          
          if git diff --staged --quiet; then
            echo "No data changes detected. Everything is up to date."
          else
            STAMP=$(date -u +"%Y-%m-%d")
            git commit -m "chore(data): auto-update climate drivers and plumes ($STAMP)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
            echo "Pushed updated climate datasets to branch ${{ github.ref_name }}."
          fi
